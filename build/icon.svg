<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="squircle">
      <rect x="16" y="16" width="480" height="480" rx="112"/>
    </clipPath>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd6f7"/>
      <stop offset="0.28" stop-color="#38a8e8"/>
      <stop offset="0.62" stop-color="#1e63c8"/>
      <stop offset="1" stop-color="#122a72"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe6f5"/>
    </linearGradient>
    <linearGradient id="penguin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3a52"/>
      <stop offset="0.5" stop-color="#141d2e"/>
      <stop offset="1" stop-color="#0a111f"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe9f2"/>
    </linearGradient>
    <linearGradient id="whale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e4f74"/>
      <stop offset="0.55" stop-color="#1b3a5c"/>
      <stop offset="1" stop-color="#102741"/>
    </linearGradient>
    <linearGradient id="whaleBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fc4dd"/>
      <stop offset="1" stop-color="#6f9cbd"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f8fb"/>
      <stop offset="0.5" stop-color="#c2d2de"/>
      <stop offset="1" stop-color="#8fa6b8"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5702f"/>
      <stop offset="1" stop-color="#7c4514"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#bdeafd" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#bdeafd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- mar -->
    <rect x="16" y="16" width="480" height="480" fill="url(#sea)"/>
    <rect x="16" y="16" width="480" height="480" fill="url(#glow)"/>

    <!-- raios de luz entrando na água -->
    <polygon points="150,180 210,180 320,496 200,496" fill="#dff4ff" opacity="0.07"/>
    <polygon points="240,180 280,180 430,496 340,496" fill="#dff4ff" opacity="0.05"/>

    <!-- superfície da água -->
    <path d="M16 196 Q60 184 104 194 T192 194 T280 194 T368 194 T456 194 T520 192 L520 176 L16 176 Z"
          fill="#a5e2fb" opacity="0.5"/>
    <path d="M16 194 Q60 182 104 192 T192 192 T280 192 T368 192 T456 192 T520 190"
          fill="none" stroke="#eafaff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <path d="M300 216 Q330 208 360 215 T420 215" fill="none" stroke="#cdeffd" stroke-width="4"
          stroke-linecap="round" opacity="0.45"/>
    <path d="M64 238 Q88 231 112 237 T160 237" fill="none" stroke="#cdeffd" stroke-width="4"
          stroke-linecap="round" opacity="0.35"/>

    <!-- bloco de gelo -->
    <path d="M44 214 L64 190 L200 190 L226 212 L214 234 L58 234 Z" fill="url(#ice)"/>
    <path d="M58 234 L214 234 L206 252 L68 252 Z" fill="#9cc6e0"/>
    <path d="M44 214 L64 190 L86 190 L60 218 Z" fill="#ffffff" opacity="0.7"/>

    <!-- pinguim -->
    <g>
      <!-- pés -->
      <path d="M96 196 q-10 -2 -12 6 q8 6 24 3 l4 -8 Z" fill="#f6a21c"/>
      <path d="M148 196 q10 -2 12 6 q-8 6 -24 3 l-4 -8 Z" fill="#f6a21c"/>
      <!-- corpo -->
      <path d="M122 74
               C 90 74 74 106 74 140
               C 74 172 88 200 122 200
               C 156 200 170 172 170 140
               C 170 106 154 74 122 74 Z" fill="url(#penguin)"/>
      <!-- barriga -->
      <path d="M122 102
               C 102 102 92 126 92 152
               C 92 178 104 196 122 196
               C 140 196 152 178 152 152
               C 152 126 142 102 122 102 Z" fill="url(#belly)"/>
      <!-- bochechas claras -->
      <circle cx="105" cy="103" r="13" fill="#eef6fb"/>
      <circle cx="139" cy="103" r="13" fill="#eef6fb"/>
      <!-- olhos -->
      <circle cx="107" cy="102" r="6.5" fill="#101827"/>
      <circle cx="137" cy="102" r="6.5" fill="#101827"/>
      <circle cx="109.5" cy="99.5" r="2.2" fill="#ffffff"/>
      <circle cx="139.5" cy="99.5" r="2.2" fill="#ffffff"/>
      <!-- bico -->
      <path d="M112 112 L132 112 L122 126 Z" fill="#f6a21c"/>
      <path d="M112 112 L132 112 L122 117 Z" fill="#d97e08"/>
      <!-- cachecol -->
      <path d="M100 128 Q122 140 144 128 L142 140 Q122 150 102 140 Z" fill="#e0473d"/>
      <path d="M136 136 l6 22 q-8 4 -12 0 l0 -20 Z" fill="#c93a31"/>
      <!-- asa esquerda apoiada -->
      <path d="M80 130 Q66 152 82 174 Q92 160 90 136 Z" fill="#0d1626"/>
      <!-- asa direita segurando a vara -->
      <path d="M160 128 Q182 132 196 122 L192 112 Q172 116 158 116 Z" fill="#0d1626"/>
    </g>

    <!-- vara de pescar -->
    <g>
      <path d="M186 118 Q280 74 352 64" fill="none" stroke="url(#wood)" stroke-width="9" stroke-linecap="round"/>
      <path d="M186 118 Q280 74 352 64" fill="none" stroke="#e8b06a" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
      <!-- molinete -->
      <circle cx="216" cy="106" r="10" fill="#37475c"/>
      <circle cx="216" cy="106" r="5" fill="#b9c9d8"/>
      <line x1="216" y1="106" x2="226" y2="114" stroke="#b9c9d8" stroke-width="3" stroke-linecap="round"/>
      <!-- linha -->
      <path d="M352 64 C 366 120 358 190 356 252" fill="none" stroke="#f2f8fc" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
    </g>

    <!-- âncora (isca) -->
    <g>
      <circle cx="356" cy="262" r="9" fill="none" stroke="url(#metal)" stroke-width="6"/>
      <rect x="352.5" y="270" width="7" height="60" rx="3.5" fill="url(#metal)"/>
      <rect x="332" y="284" width="48" height="7" rx="3.5" fill="url(#metal)"/>
      <circle cx="331" cy="287.5" r="5" fill="#d7e3ec"/>
      <circle cx="381" cy="287.5" r="5" fill="#d7e3ec"/>
      <path d="M356 330 Q332 326 324 304 L310 312 Q318 344 356 348 Q394 344 402 312 L388 304 Q380 326 356 330 Z"
            fill="url(#metal)"/>
      <path d="M310 312 L300 296 L322 298 Z" fill="url(#metal)"/>
      <path d="M402 312 L412 296 L390 298 Z" fill="url(#metal)"/>
    </g>

    <!-- baleia -->
    <g>
      <!-- cauda -->
      <path d="M448 372 Q470 344 466 318 Q488 336 492 366 Q510 352 512 330 L512 392 Q484 402 448 372 Z"
            fill="url(#whale)"/>
      <!-- corpo -->
      <path d="M188 470
               C 200 408 260 366 330 366
               C 396 366 452 400 462 452
               C 466 476 460 496 450 496
               L 200 496
               C 190 496 184 486 188 470 Z" fill="url(#whale)"/>
      <!-- barriga com sulcos acompanhando o contorno inferior -->
      <path d="M196 474 C 212 430 252 404 304 400 L 300 496 L 200 496 C 190 496 186 488 196 474 Z"
            fill="url(#whaleBelly)" opacity="0.55"/>
      <path d="M208 486 C 222 448 256 424 300 418" fill="none" stroke="#57809f" stroke-width="3" opacity="0.7"/>
      <path d="M226 492 C 240 458 270 436 308 430" fill="none" stroke="#57809f" stroke-width="3" opacity="0.5"/>
      <path d="M248 496 C 260 468 286 450 318 444" fill="none" stroke="#57809f" stroke-width="3" opacity="0.35"/>
      <!-- boca sorrindo, virada para a isca -->
      <path d="M218 452 Q258 420 310 412" fill="none" stroke="#0b1626" stroke-width="5"
            stroke-linecap="round" opacity="0.85"/>
      <path d="M306 416 Q316 408 328 408" fill="none" stroke="#0b1626" stroke-width="5"
            stroke-linecap="round" opacity="0.85"/>
      <!-- olho -->
      <circle cx="330" cy="430" r="9" fill="#0b1626"/>
      <circle cx="333" cy="427" r="3" fill="#cfe4f2"/>
      <path d="M318 418 Q330 412 342 418" fill="none" stroke="#0b1626" stroke-width="2.5" opacity="0.55"/>
      <!-- nadadeira -->
      <path d="M340 466 Q370 474 386 496 Q352 496 330 482 Z" fill="#12293f"/>
      <!-- respiro subindo em direção à âncora -->
      <circle cx="342" cy="372" r="6" fill="#bfe6fb" opacity="0.85"/>
      <circle cx="352" cy="352" r="4.5" fill="#bfe6fb" opacity="0.65"/>
      <circle cx="346" cy="334" r="3.5" fill="#bfe6fb" opacity="0.45"/>
    </g>

    <!-- bolhas ambiente -->
    <circle cx="86" cy="330" r="7" fill="#d8f1ff" opacity="0.35"/>
    <circle cx="102" cy="302" r="4.5" fill="#d8f1ff" opacity="0.3"/>
    <circle cx="452" cy="230" r="5" fill="#d8f1ff" opacity="0.3"/>
    <circle cx="72" cy="420" r="5.5" fill="#d8f1ff" opacity="0.25"/>
  </g>
</svg>
